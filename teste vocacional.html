<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Caminho - Teste Vocacional Prático</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .fade-out {
            animation: fadeOut 0.3s ease-in forwards;
        }

        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(200%) rotate(45deg); }
        }
        
        .card-hover:hover .card-shine {
            animation: shine 1.5s ease-out;
        }
        .avatar-float {
            animation: float 4s ease-in-out infinite;
        }

        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }
        .option-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="w-full max-w-2xl bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden relative min-h-[450px] flex flex-col">
        
        <!-- PROGRESS BAR -->
        <div class="h-2 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500 w-full" id="progress-bar-container" style="display: none;">
            <div id="progress-bar" class="h-full bg-slate-900 w-0 transition-all duration-500 ease-out"></div>
        </div>

        <div class="p-8 md:p-12 flex-grow flex flex-col justify-center relative">
            
            <div id="start-screen" class="text-center slide-up">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-100 text-indigo-600 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 tracking-tight">Caminho <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-500">Prático</span></h1>
                <p class="text-lg text-gray-600 mb-8 max-w-lg mx-auto">
                    Mergulhe em 15 cenários reais de projetos e decisões. Suas escolhas diante de desafios do dia a dia definirão seu perfil profissional.
                </p>
                <button onclick="startTest()" class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-semibold py-3 px-8 rounded-full text-lg shadow-lg hover:shadow-indigo-500/30 transition-all hover:scale-105 active:scale-95">
                    Iniciar Simulação
                </button>
            </div>

            <div id="quiz-screen" class="hidden w-full">
                <div class="mb-8">
                    <span id="question-counter" class="text-sm font-semibold text-indigo-500 tracking-wider uppercase mb-2 block">Cenário 1 de 15</span>
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 leading-tight"></h2>
                </div>
                
                <div id="options-container" class="space-y-4">
                    <!-- Options injected via JS -->
                </div>
            </div>

            <div id="result-screen" class="hidden text-center w-full flex flex-col items-center">
                <h3 class="text-slate-800 text-xl font-bold mb-6">Seu Perfil Profissional Desbloqueado!</h3>

                <!-- TRADING CARD CONTAINER -->
                <div id="trading-card-border" class="relative w-full max-w-sm p-1.5 rounded-[2rem] shadow-2xl mb-8 card-hover transition-all duration-500 hover:scale-105 hover:-translate-y-2 bg-gradient-to-br from-gray-200 to-gray-400">
                    
                    <div id="trading-card-inner" class="bg-slate-900 rounded-[1.75rem] overflow-hidden relative flex flex-col h-full border border-white/20">
                        <div class="card-shine absolute top-0 -inset-full h-full w-1/2 z-20 block transform -skew-x-12 bg-gradient-to-r from-transparent via-white/20 to-transparent opacity-0 transition-opacity"></div>
                        
                        <!-- Card Art / Header -->
                        <div id="card-art-bg" class="relative h-48 w-full flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-700 overflow-hidden">
                            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                            
                            <div class="relative z-10 avatar-float">
                                <div class="w-28 h-28 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border-4 border-white/50 shadow-[0_0_30px_rgba(255,255,255,0.3)] relative">
                                    <span id="result-emoji" class="text-6xl drop-shadow-lg">🧑‍💻</span>
                                    <div id="result-badge" class="absolute -bottom-2 -right-2 w-10 h-10 bg-white rounded-full flex items-center justify-center text-xl shadow-lg border-2 border-slate-800">⚡</div>
                                </div>
                            </div>
                        </div>

                        <!-- Card Content -->
                        <div class="p-6 bg-white flex-grow flex flex-col relative z-10 text-left rounded-t-3xl -mt-4">
                            <span id="result-category" class="text-xs font-black tracking-widest uppercase mb-1 block text-gray-400">Categoria</span>
                            <h2 id="result-character-name" class="text-2xl font-extrabold text-slate-800 mb-3 leading-tight uppercase tracking-tight">O Nome</h2>
                            
                            <p id="result-desc" class="text-sm text-slate-600 leading-relaxed mb-5 flex-grow font-medium">
                                Descrição...
                            </p>
                            
                            <!-- Stats Area -->
                            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 mb-4">
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Atributos Principais</h4>
                                <div id="result-stats" class="space-y-2">
                                    <!-- Stats Injected via JS -->
                                </div>
                            </div>

                            <!-- Professions -->
                            <div class="mt-auto pt-4 border-t border-slate-100">
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Aplicações Práticas</h4>
                                <p id="result-professions-text" class="text-sm font-semibold text-slate-700"></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button onclick="restartTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-full text-lg shadow-lg transition-all hover:scale-105 active:scale-95">
                    Refazer Simulação
                </button>
            </div>

        </div>
    </div>

    <script>
        const questions = [

                ]
            },
            {

                ]
            },
            {
                question: "Um amigo está abrindo um restaurante e pede sua ajuda. O que você faz?",
                options: [
                    { text: "Instalo o sistema de PDV, banco de dados de clientes, Wi-Fi e automação de pedidos.", category: "tech" },
                    { text: "Crio o design do cardápio, a identidade visual da marca e a decoração do ambiente.", category: "creative" },

                ]
            },
            {
                question: "Em uma feira de ciências da universidade, qual seria o seu estande?",
                options: [
                    { text: "Um braço robótico controlado por inteligência artificial e sensores.", category: "tech" },
                    { text: "Uma instalação de arte interativa imersiva que reage ao movimento do público.", category: "creative" },
                    { text: "Uma análise comparativa de microscopia de bactérias em diferentes superfícies.", category: "health" },
                    { text: "Um aplicativo simulador realista de mercado de ações para jovens.", category: "business" },
                    { text: "Um estudo de campo sobre o impacto psicológico do algoritmo das redes sociais.", category: "humanities" }
                ]
            },
            {
                question: "Como você lida com um eletrodoméstico ou gadget que quebrou em casa?",
                options: [
                    { text: "Abro para ver os circuitos, procuro o defeito no Google/YouTube e tento consertar.", category: "tech" },
                    { text: "Se não der para usar, tento customizar por fora para virar um objeto de decoração.", category: "creative" },
                    { text: "Minha primeira preocupação é se há risco de choque, incêndio ou liberação de gases.", category: "health" },
                    { text: "Avalio friamente se o custo de consertar compensa mais do que comprar um novo.", category: "business" },
                    { text: "Dou para alguém que precisa e sabe arrumar, ou garanto que seja reciclado corretamente.", category: "humanities" }
                ]
            },
            {
                question: "Seu grupo está perdido em uma ilha deserta. Qual o seu papel principal?",
                options: [
                    { text: "Construir ferramentas ou tentar montar um rádio transmissor com sucata.", category: "tech" },
                    { text: "Desenhar mapas da ilha e pensar na ergonomia e proteção do acampamento.", category: "creative" },
                    { text: "Identificar plantas medicinais, purificar a água e tratar possíveis ferimentos.", category: "health" },
                    { text: "Fazer o inventário de recursos, organizar o racionamento e delegar tarefas operacionais.", category: "business" },
                    { text: "Manter o moral do grupo alto, mediar conflitos por comida e promover união.", category: "humanities" }
                ]
            },
            {
                question: "No fim do dia, qual é o objetivo prático do seu trabalho ideal?",
                options: [
                    { text: "Otimizar sistemas para que tudo funcione de forma mais rápida, automatizada e lógica.", category: "tech" },
                    { text: "Inspirar as pessoas e deixar o ambiente ao meu redor mais belo, funcional e vibrante.", category: "creative" },
                    { text: "Proteger, curar e nutrir a vida de humanos, animais ou do meio ambiente.", category: "health" },
                    { text: "Gerar escalabilidade, riqueza corporativa, eficiência e crescimento sustentável.", category: "business" },
                    { text: "Defender os direitos humanos, educar as próximas gerações e trazer significado à vida.", category: "humanities" }
                ]

        ];

        const resultsData = {
            tech: {
                character: "O Arquiteto de Sistemas",
                category: "Tecnologia, Dados & Engenharias",
                emoji: "🤖",
                badge: "⚙️",
                bgGradient: "from-blue-500 to-cyan-700",
                borderGradient: "from-blue-300 via-cyan-500 to-blue-600",
                statColor: "bg-blue-500",
                stats: { "Lógica": 98, "Solução": 95, "Foco": 88 },
                desc: "Você é prático, focado em otimização e adora resolver quebra-cabeças complexos. Onde os outros veem caos, você vê dados e algoritmos esperando para serem estruturados.",
                professions: "Engenharia de Software, Ciência de Dados, IA, Automação, Mecatrônica"
            },
            creative: {
                character: "O Diretor Criativo",
                category: "Design, Artes & Mídia",
                emoji: "🎨",
                badge: "✨",
                bgGradient: "from-purple-500 to-pink-600",
                borderGradient: "from-pink-400 via-purple-500 to-indigo-500",
                statColor: "bg-purple-500",
                stats: { "Inovação": 99, "Estética": 96, "Visão": 90 },
                desc: "Sua mente trabalha visualmente e fora da caixa. Você resolve problemas através da estética, da experiência do usuário e da comunicação visual impactante.",
                professions: "Design UX/UI, Direção de Arte, Arquitetura, Audiovisual, Marketing Criativo"
            },
            health: {
                character: "O Especialista Vital",
                category: "Saúde & Ciências Biológicas",
                emoji: "🧬",
                badge: "🌿",
                bgGradient: "from-emerald-400 to-teal-700",
                borderGradient: "from-emerald-300 via-teal-500 to-green-600",
                statColor: "bg-emerald-500",
                stats: { "Cuidado": 98, "Pesquisa": 92, "Empatia": 95 },
                desc: "Sua vocação prática é a manutenção e o estudo da vida. Seja na pesquisa de microscópicos, na linha de frente clínica ou na preservação ambiental, seu foco é o bem-estar.",
                professions: "Medicina, Biomedicina, Psicologia Clínica, Veterinária, Engenharia Ambiental"
            },
            business: {
                character: "O Gestor de Resultados",
                category: "Negócios, Finanças & Estratégia",
                emoji: "📊",
                badge: "📈",
                bgGradient: "from-amber-400 to-orange-600",
                borderGradient: "from-yellow-300 via-amber-500 to-orange-600",
                statColor: "bg-amber-500",
                stats: { "Estratégia": 97, "Liderança": 94, "Visão de Mercado": 98 },
                desc: "Você prospera organizando recursos, calculando lucros e liderando equipes para atingir metas. Sua mente é focada em escalabilidade e retorno sobre investimento.",
                professions: "Administração, Economia, Empreendedorismo, Gestão de Projetos, Finanças"
            },
            humanities: {
                character: "O Articulador Social",
                category: "Humanas, Educação & Logística Social",
                emoji: "🌍",
                badge: "🤝",
                bgGradient: "from-rose-500 to-red-700",
                borderGradient: "from-rose-300 via-red-500 to-pink-600",
                statColor: "bg-rose-500",
                stats: { "Mediação": 98, "Comunicação": 95, "Organização": 90 },
                desc: "Você domina a logística humana: organizar pessoas, mediar conflitos, educar e gerenciar a dinâmica social de grupos, eventos e sociedades.",
                professions: "Direito, Relações Públicas, Produção de Eventos/Turismo, Sociologia, Pedagogia"
            }
        };

        let currentQuestionIndex = 0;
        let scores = { tech: 0, creative: 0, health: 0, business: 0, humanities: 0 };

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCounter = document.getElementById('question-counter');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');

        function startTest() {
            startScreen.classList.replace('slide-up', 'fade-out');
            
            setTimeout(() => {
                startScreen.classList.add('hidden');
                startScreen.classList.remove('fade-out');
                
                quizScreen.classList.remove('hidden');
                progressBarContainer.style.display = 'block';
                quizScreen.classList.add('fade-in');
                
                loadQuestion();
            }, 300);
        }

        function loadQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            
            questionCounter.textContent = `Cenário ${currentQuestionIndex + 1} de ${questions.length}`;
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            
            requestAnimationFrame(() => {
                progressBar.style.width = `${progress}%`;
            });
            
            questionText.textContent = currentQuestion.question;
            optionsContainer.innerHTML = '';
            
            let shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-indigo-50 bg-white hover:border-indigo-200 hover:bg-indigo-50 text-gray-700 font-medium transition-all duration-200 opacity-0 transform translate-y-4`;
                btn.innerHTML = `<span class="inline-block mr-2 text-indigo-400 font-bold">${String.fromCharCode(65 + index)}.</span> ${option.text}`;
                
                btn.style.animation = `slideUp 0.3s ease-out ${index * 0.1}s forwards`;
                
                btn.onclick = () => handleOptionClick(option.category);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionClick(category) {
            scores[category]++;
            
            quizScreen.classList.remove('fade-in');
            quizScreen.classList.add('fade-out');
            
            setTimeout(() => {
                currentQuestionIndex++;
                quizScreen.classList.remove('fade-out');
                
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                    quizScreen.classList.add('fade-in');
                } else {
                    calculateResults();
                }
            }, 300);
        }

        function calculateResults() {
            progressBar.style.width = '100%';
            
            setTimeout(() => {
                progressBarContainer.style.display = 'none';
                quizScreen.classList.add('hidden');
                
                let winningCategory = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
                const result = resultsData[winningCategory];

                document.getElementById('result-emoji').textContent = result.emoji;
                document.getElementById('result-badge').textContent = result.badge;
                
                const cardBorder = document.getElementById('trading-card-border');
                cardBorder.className = `relative w-full max-w-sm p-1.5 rounded-[2rem] shadow-2xl mb-8 card-hover transition-all duration-500 hover:scale-105 hover:-translate-y-2 bg-gradient-to-br ${result.borderGradient}`;
                
                const cardArtBg = document.getElementById('card-art-bg');
                cardArtBg.className = `relative h-48 w-full flex items-center justify-center bg-gradient-to-br ${result.bgGradient} overflow-hidden`;

                document.getElementById('result-category').textContent = result.category;
                
                const charNameElement = document.getElementById('result-character-name');
                charNameElement.textContent = result.character;
                
                const colorMap = {
                    tech: 'text-blue-500',
                    creative: 'text-purple-500',
                    health: 'text-emerald-500',
                    business: 'text-amber-500',
                    humanities: 'text-rose-500'
                };
                charNameElement.className = `text-2xl font-extrabold mb-3 leading-tight uppercase tracking-tight ${colorMap[winningCategory]}`;
                
                document.getElementById('result-desc').textContent = result.desc;
                
                const statsContainer = document.getElementById('result-stats');
                statsContainer.innerHTML = '';
                
                Object.entries(result.stats).forEach(([statName, value]) => {
                    const statRow = document.createElement('div');
                    statRow.className = 'flex items-center justify-between';
                    statRow.innerHTML = `
                        <span class="text-xs font-bold text-slate-600 w-28">${statName}</span>
                        <div class="flex-grow bg-slate-200 h-2.5 rounded-full overflow-hidden ml-2">
                            <div class="${result.statColor} h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                        </div>
                        <span class="text-xs font-black text-slate-700 w-8 text-right ml-2">${value}</span>
                    `;
                    statsContainer.appendChild(statRow);
                    
                    setTimeout(() => {
                        statRow.querySelector(`.${result.statColor}`).style.width = `${value}%`;
                    }, 100);
                });

                document.getElementById('result-professions-text').textContent = result.professions;

                resultScreen.classList.remove('hidden');
                resultScreen.classList.add('slide-up');
                
                setTimeout(() => {
                    const shine = document.querySelector('.card-shine');
                    shine.style.animation = 'shine 1.5s ease-out';
                }, 800);

            }, 500);
        }

        function restartTest() {
            resultScreen.classList.replace('slide-up', 'fade-out');
            
            setTimeout(() => {
                resultScreen.classList.add('hidden');
                resultScreen.classList.remove('fade-out');
                
                currentQuestionIndex = 0;
                scores = { tech: 0, creative: 0, health: 0, business: 0, humanities: 0 };
                progressBar.style.width = '0%';
                
                startScreen.classList.remove('hidden');
                startScreen.classList.add('fade-in');
            }, 300);
        }
    </script>
</body>
</html>
